<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Theme: apply before paint to avoid flash (runs sync, before React) -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('gsl-interpreter-settings');
        var colorScheme = 'default';
        if (stored) {
          var parsed = JSON.parse(stored);
          colorScheme = parsed?.state?.settings?.visual?.colorScheme || 'default';
        }
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = colorScheme === 'dark' || (colorScheme === 'default' && prefersDark);
        document.documentElement.classList.toggle('dark', isDark);
      } catch (e) {
        console.error('Theme sync error', e);
      }
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- Mobile-first viewport with safe-area support for notched phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- Mobile browser chrome color -->
  <meta name="theme-color" content="#0f172a" />
  <!-- PWA / installable on Android & iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- SEO -->
  <title>SignBridge Ghana — Ghana Sign Language Interpreter</title>
  <meta name="description"
    content="SignBridge Ghana: Real-time bidirectional Ghana Sign Language interpreter. Breaking communication barriers with AI." />
  <meta property="og:title" content="SignBridge Ghana — AI Sign Language Interpreter" />
  <meta property="og:description" content="Real-time Ghana Sign Language interpretation powered by AI." />
  <meta property="og:type" content="website" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
